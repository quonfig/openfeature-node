# Dependabot version updates (weekly, minor+patch grouped into one PR per
# ecosystem). Security updates are enabled separately on the repo and are not
# grouped, so each advisory fix arrives as its own PR. SOC 2 SSDLC, qfg-66ko.3.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - npm
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Runtime and peer dependencies of the published package. The range we
      # declare is the floor customers must install, so a major bump here
      # forces every customer onto that major. Raise these floors
      # deliberately in a release, not via Dependabot.
      - dependency-name: "@quonfig/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@openfeature/server-sdk"
        update-types: ["version-update:semver-major"]
